  body{

  /* ============ 概览指标 ============ */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:var(--c-bg);border:1px solid var(--c-divider);border-radius:var(--radius);
       padding:14px 16px;box-shadow:var(--shadow);}
  .kpi .k-lb{font-size:12px;color:var(--c-sub-t);margin-bottom:6px;}
  .kpi .k-vl{font-size:26px;font-weight:700;color:var(--c-primary);line-height:1.1;
             font-variant-numeric:tabular-nums;}
  .kpi .k-vl small{font-size:13px;font-weight:500;color:var(--c-sub-t);margin-left:3px;}
  .kpi.hl{background:linear-gradient(180deg,#FFFFFF 0%,var(--c-sub2) 100%);border-color:#D3E3F5;}
  .kpi.hl .k-vl{color:var(--c-accent);}
  .kpi .k-sub{font-size:11px;color:var(--c-weak);margin-top:4px;}

  /* ============ 筛选区 ============ */
  .filters{background:var(--c-bg);border:1px solid var(--c-divider);border-radius:var(--radius);
           padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;}
  .f-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}

  .f-lb{font-size:13px;font-weight:600;color:var(--c-primary);min-width:56px;flex-shrink:0;}
  .seg{display:inline-flex;background:var(--c-sub2);border:1px solid var(--c-divider);

  .seg button{

    background:transparent;border:none;border-radius:999px;padding:6px 15px;cursor:pointer;
    transition:all .16s;white-space:nowrap;
  }
  .seg button:hover{color:var(--c-primary);background:#fff;}
  .seg button.on{background:var(--c-primary);color:#fff;font-weight:600;
                 box-shadow:0 1px 4px rgba(20,83,143,.28);}
  .seg.lines button.on{background:var(--c-accent);box-shadow:0 1px 4px rgba(242,130,12,.3);}

  .tabs button.on{color:var(--c-primary);font-weight:600;border-bottom-color:var(--c-primary);}

  .card{background:var(--c-bg);border:1px solid var(--c-divider);border-radius:var(--radius);

            vertical-align:middle;}
  .empty{padding:56px 20px;text-align:center;color:var(--c-weak);font-size:14px;}

  .bars{display:flex;flex-direction:column;gap:14px;}

            transition:background .16s;}

  .bar-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px;}
  .bar-name{font-size:14px;font-weight:600;color:var(--c-text);}

  .modal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);

  .m-s2 .n{color:var(--c-sub-t);} .m-s2 .n b{color:var(--c-text);font-weight:600;margin-left:5px;}
  .m-note{background:var(--c-accent-l);border-left:3px solid var(--c-accent);border-radius:6px;

  .rg-t .p{font-size:14px;font-weight:700;}
  .rg-l{font-size:11px;color:var(--c-sub-t);display:flex;justify-content:space-between;

  .foot{text-align:center;font-size:12px;color:var(--c-weak);margin-top:28px;line-height:1.9;}

    .kpi .k-vl{font-size:22px;}
    .f-lb{min-width:100%;}
    select{min-width:100%;}
    .seg button{padding:6px 11px;font-size:12px;}
    .card{padding:16px 14px;}
    .bar-name{font-size:13px;}
    .bar-vals{font-size:12px;}
    .bar-vals b{font-size:14px;}
    .mask{padding:10px;}
    .modal{max-height:92vh;}
    .m-bd{padding:14px 15px;} .m-hd{padding:16px 15px 12px;}
  }
</style>

function pickedRegions(){
  if(S.item!=='__ALL__' || S.region!=='全部'){
    if(S.region!=='全部') return [S.region];
  }
  return REGIONS;
}

// 单区域聚合（跨命中战役）
function aggRegion(region, items){
  var a={alloc:0,done:0,settled:0,planOpen:0,confirmed:0,nol:0,yol:0,rol:0,has:false};
  items.forEach(function(it){
    var r=rowOf(it,region); if(!r) return;
    a.has=true;
    ['alloc','done','settled','planOpen','confirmed','nol','yol','rol'].forEach(function(k){
      if(r[k]!==null&&r[k]!==undefined) a[k]+=r[k];
    });
  });
  a.settleRate = a.done>0 ? a.settled/a.done*100 : null;
  a.execRate   = a.alloc>0 ? a.done/a.alloc*100 : null;
  return a;
}
// 单战役聚合
function aggItem(it){
  var a={alloc:n(it.alloc),done:n(it.done),settled:n(it.settled),
         planOpen:n(it.planOpen),confirmed:n(it.confirmed),cancel:n(it.cancel),
         nol:n(it.nol),yol:n(it.yol),rol:n(it.rol)};
  a.settleRate = a.done>0 ? a.settled/a.done*100 : null;
  a.execRate   = a.alloc>0 ? a.done/a.alloc*100 : null;
  a.planRate   = a.alloc>0 ? a.confirmed/a.alloc*100 : null;
  return a;
}

/* ---------- KPI ---------- */
function renderKpis(){
  var items=pickedItems(), reg=S.region;
  var tot={alloc:0,done:0,settled:0,nol:0,yol:0,rol:0};
  if(reg==='全部'){
    items.forEach(function(it){ var a=aggItem(it);
      tot.alloc+=a.alloc; tot.done+=a.done; tot.settled+=a.settled;
      tot.nol+=a.nol; tot.yol+=a.yol; tot.rol+=a.rol; });
  }else{
    items.forEach(function(it){ var r=rowOf(it,reg); if(!r)return;
      ['alloc','done','settled','nol','yol','rol'].forEach(function(k){ if(r[k]!==null&&r[k]!==undefined) tot[k]+=r[k]; }); });
  }
  var sr = tot.done>0 ? tot.settled/tot.done*100 : null;
  var er = tot.alloc>0 ? tot.done/tot.alloc*100 : null;
  var cover = tot.nol+tot.yol+tot.rol;

  el('kpis').innerHTML =
    kpi('规划场次', fmt(tot.alloc), '场', '覆盖 '+items.length+' 个战役') +
    kpi('已开展场次', fmt(tot.done), '场', '执行率 '+(er===null?'—':Math.round(er)+'%')) +
    kpi('已核销场次', fmt(tot.settled), '场', '核销率 '+(sr===null?'—':Math.round(sr)+'%'), true) +
    kpi('待核销场次', fmt(Math.max(0,tot.done-tot.settled)), '场', '已开展未核销，待推进') +
    kpi('覆盖人数合计', fmt(cover), '人', 'NOL '+fmt(tot.nol)+' ｜ YOL '+fmt(tot.yol)+' ｜ ROL '+fmt(tot.rol));
  el('stamp').textContent = M.updated;
}
function kpi(l,v,u,s,hl){
  return '<div class="kpi'+(hl?' hl':'')+'"><div class="k-lb">'+l+'</div>'+
         '<div class="k-vl">'+v+'<small>'+u+'</small></div>'+
         '<div class="k-sub">'+s+'</div></div>';
}

/* ---------- 筛选控件 ---------- */
function renderFilters(){
  // 区域
  var h='<button data-r="全部" class="'+(S.region==='全部'?'on':'')+'">全部区域</button>';
  REGIONS.forEach(function(r){ h+='<button data-r="'+r+'" class="'+(S.region===r?'on':'')+'">'+r.replace('区域','')+'</button>'; });
  el('segRegion').innerHTML=h;

  // 肺肿线
  var L=['全部','早肺','晚肺'];
  el('segLine').innerHTML = L.map(function(l){
    return '<button data-l="'+l+'" class="'+(S.line===l?'on':'')+'">'+(l==='全部'?'全部':l)+'</button>';
  }).join('');

  // 战役（仅显示与所选肺肿线匹配的；全部 13 个项目，含已停止的云端ARTS2.0）
  var pool = visibleItems();
  var opts=['<option value="__ALL__">全部战役（'+(S.line==='全部'?'13':pool.length)+' 个）</option>'];
  if(S.line!=='全部'){
    // 已选定肺肿线：平铺展示，不再分组，更直观
    pool.forEach(function(it){
      opts.push('<option value="'+it.id+'">'+it.name+'</option>');
    });
  }else{
    // 全部肺肿线：按 早肺 / 晚肺 分组
    var order=['早肺','晚肺'];
    order.forEach(function(ln){
      var g=pool.filter(function(it){return it.line===ln;});
      if(!g.length) return;
      opts.push('<optgroup label="'+ln+'（'+g.length+'）">');
      g.forEach(function(it){ opts.push('<option value="'+it.id+'">'+it.name+'</option>'); });
      opts.push('</optgroup>');
    });
  }
  var sel=el('selItem');
  sel.innerHTML=opts.join('');
  sel.value = S.item;
  if(sel.value!==S.item) { S.item='__ALL__'; sel.value='__ALL__'; }
}

// 当前肺肿线下的可选战役
function visibleItems(){
  return ITEMS.filter(function(it){ return S.line==='全部' || it.line===S.line; });
}

/* ---------- 图表 ---------- */
function barItem(name, tag, a){
  var alloc=n(a.alloc), done=n(a.done), settled=n(a.settled);
  var sPct = alloc>0 ? settled/alloc*100 : 0;
  var dPct = alloc>0 ? done/alloc*100 : 0;
  var unPct = Math.max(0, 100-dPct);
  var sr = a.settleRate;
  var hasData = alloc>0 || done>0;
  var html = '<div class="bar-item" data-k="'+name+'">'+
    '<div class="bar-top"><div class="bar-name">'+name+(tag?'<span class="tag">'+tag+'</span>':'')+'</div>'+
    '<div class="bar-vals">核销 <b>'+fmt(settled)+'</b> / 已开展 '+fmt(done)+
    ' ｜ 核销率 <span class="pct '+cls(sr)+'">'+(sr===null?'—':Math.round(sr)+'%')+'</span></div></div>'+
    '<div class="bar-track">'+
      (hasData ? '<div class="bar-seg settled" style="width:'+sPct.toFixed(2)+'%"></div>'+
                 '<div class="bar-seg done" style="width:'+Math.max(0,dPct-sPct).toFixed(2)+'%"></div>'+
                 '<div class="bar-seg remain" style="width:'+unPct.toFixed(2)+'%"></div>'
               : '<div class="bar-seg remain" style="width:100%"></div>')+
    '</div>'+
    '<div class="bar-note">规划 '+fmt(alloc)+' 场 ｜ 已开展 '+fmt(done)+' 场（执行率 '+
      (a.execRate===null?'—':Math.round(a.execRate)+'%')+'） ｜ 已核销 '+fmt(settled)+' 场</div>'+
  '</div>';
  return html;
}

// 核销率排序：从高到低（核销率为 null 的排最后；同率按已核销场次、再按名称兜底，保证顺序稳定）
function bySettleRate(x,y){
  var rx=x.a.settleRate, ry=y.a.settleRate;
  if(rx===null&&ry===null) return n(y.a.settled)-n(x.a.settled);
  if(rx===null) return 1;
  if(ry===null) return -1;
  if(ry!==rx) return ry-rx;
  return n(y.a.settled)-n(x.a.settled);
}

function renderChart(){
  var box=el('chart'), items=pickedItems(), view=S.view;
  if(!items.length){ box.innerHTML='<div class="empty">当前筛选条件下暂无数据</div>'; return; }

  if(view==='region'){
    if(S.region!=='全部'){
      // 单区域视图 → 按战役展开（按核销率从高到低）
      el('cTitle').textContent = S.region + ' · 各战役完成核销情况';
      el('cSub').textContent = '共 '+items.length+' 个战役，按核销率从高到低 ｜ 点击任一条查看该战役明细';
      var arr0=items.map(function(it){ return {it:it,a:aggRegion(S.region,[it])}; });
      arr0.sort(bySettleRate);
      box.innerHTML='<div class="bars">'+arr0.map(function(x){
        return barItem(x.it.name, x.it.line, x.a);
      }).join('')+'</div>';
      return;
    }
    // 全部区域对比（按核销率从高到低）
    el('cTitle').textContent='各区域完成核销情况'+(S.line!=='全部'?' · '+S.line:'');
    el('cSub').textContent='共 '+items.length+' 个战役，各区域按核销率从高到低 ｜ 点击任一区域查看该区域明细';
    var arr=REGIONS.map(function(r){ return {r:r,a:aggRegion(r,items)}; })
                   .filter(function(x){ return x.a.has; });
    arr.sort(bySettleRate);
    box.innerHTML='<div class="bars">'+arr.map(function(x){
      return barItem(x.r, fmt(x.a.alloc)+' 场规划', x.a);
    }).join('')+'</div>';
    return;

  }else if(view==='item'){
    el('cTitle').textContent='各战役完成核销情况'+(S.region!=='全部'?' · '+S.region:'');
    el('cSub').textContent='共 '+items.length+' 个战役，按核销率从高到低 ｜ 点击任一战役查看区域分布';
    var arr2=items.map(function(it){ return {it:it,a:aggItem(it)}; });
    arr2.sort(bySettleRate);
    box.innerHTML='<div class="bars">'+arr2.map(function(x){
      return barItem(x.it.name, x.it.line, x.a);
    }).join('')+'</div>';
    return;

  }else{
    el('cTitle').textContent='明细表 · 区域 × 战役完成核销一览';
    el('cSub').textContent='横轴为区域，纵轴为战役（按核销率从高到低） ｜ 单元格显示 已核销 / 已开展（核销率）';
    box.innerHTML = renderTable(items);
  }
}

function rateChip(p){
  var c=cls(p);
  return '<span class="chip '+(c==='hi'?'g':c==='mid'?'o':c==='lo'?'r':'n')+'">'+
         (p===null?'—':p+'%')+'</span>';
}

function renderTable(items){
  // 表头：区域
  var head='<thead><tr><th>战役</th><th>肺肿线</th>';
  if(S.region==='全部'){ REGIONS.forEach(function(r){ head+='<th>'+r+'</th>'; }); }
  else { head+='<th>'+S.region+'</th>'; }
  head+='<th>合计</th></tr></thead>';

  var body='<tbody>';
  var colTot={}; REGIONS.forEach(function(r){ colTot[r]={alloc:0,done:0,settled:0}; });
  var gt={alloc:0,done:0,settled:0};

  // 按核销率从高到低排序（与条形图口径一致）
  var rows = items.map(function(it){ return {it:it, a:aggItem(it)}; });
  rows.sort(bySettleRate);

  rows.forEach(function(x){
    var it=x.it, a=x.a;
    body+='<tr><td>'+it.name+'</td><td><span class="chip n">'+it.line+'</span></td>';
    var scope = S.region==='全部'?REGIONS:[S.region];
    scope.forEach(function(r){
      var row=rowOf(it,r);
      if(!row){ body+='<td style="color:#C7CDD6">—</td>'; return; }
      var d=n(row.done), s=n(row.settled), al=n(row.alloc);
      var p = d>0?Math.round(s/d*100):null;
      colTot[r].alloc+=al; colTot[r].done+=d; colTot[r].settled+=s;
      body+='<td>'+fmt(s)+' / '+fmt(d)+' '+rateChip(p)+'</td>';
    });
    var d2=a.done,s2=a.settled;
    gt.alloc+=a.alloc; gt.done+=d2; gt.settled+=s2;
    var p2 = d2>0?Math.round(s2/d2*100):null;
    body+='<td><b>'+fmt(s2)+' / '+fmt(d2)+'</b> '+rateChip(p2)+'</td></tr>';
  });

  // 合计行
  body+='<tr class="total"><td>合计</td><td>—</td>';
  var scope = S.region==='全部'?REGIONS:[S.region];
  scope.forEach(function(r){
    var c=colTot[r]; var p=c.done>0?Math.round(c.settled/c.done*100):null;
    body+='<td>'+fmt(c.settled)+' / '+fmt(c.done)+' '+rateChip(p)+'</td>';
  });
  var gp=gt.done>0?Math.round(gt.settled/gt.done*100):null;
  body+='<td>'+fmt(gt.settled)+' / '+fmt(gt.done)+' '+rateChip(gp)+'</td></tr></tbody>';

  return '<div class="tbl-scroll"><table>'+head+body+'</table></div>';
}

/* ---------- 弹层 ---------- */
function openModal(html, title, sub){
  el('mTitle').textContent=title; el('mSub').textContent=sub||'';
  el('mBody').innerHTML=html; el('mask').classList.add('on');
}
function closeModal(){ el('mask').classList.remove('on'); }

// 区域明细
function showRegion(region){
  var items=pickedItems();
  var a=aggRegion(region,items);
  // 取消场次仅在「全部战役」口径下累加才准确（原表按项目列示，跨战役求和会重复计数）
  var isAll = (S.item==='__ALL__');
  var conf=0,cancel=0,planOpen=0;
  items.forEach(function(it){ var r=rowOf(it,region); if(!r)return;
    conf+=n(r.confirmed); cancel+=n(r.cancel); planOpen+=n(r.planOpen); });

  var st='<div class="m-stats">'+
    ms('规划场次', fmt(a.alloc), '') +
    ms('已开展', fmt(a.done), '') +
    ms('已核销', fmt(a.settled), 'acc') +
    ms('核销率', a.settleRate===null?'—':Math.round(a.settleRate)+'%', 'gr') +
    ms('执行率', a.execRate===null?'—':Math.round(a.execRate)+'%', '') +
    '</div>';

  st+='<div class="m-stats2">'+
    ms2('确定场次（含已开）', fmt(conf)) +
    ms2('已确定未开场次', fmt(planOpen)) +
    ms2('确定后取消场次', fmt(cancel)) +
    ms2('NOL 覆盖', fmt(a.nol)+' 人') +
    ms2('YOL 覆盖', fmt(a.yol)+' 人') +
    ms2('ROL 覆盖', fmt(a.rol)+' 人') +
    '</div>';

  // 该区域下各战役（按核销率从高到低）
  st+='<div style="font-size:13px;font-weight:600;color:#14538F;margin:16px 0 10px">各战役明细（按核销率从高到低）</div>';
  st+='<div class="rg-grid">';
  var rgRows=[];
  items.forEach(function(it){
    var r=rowOf(it,region); if(!r) return;
    var d=n(r.done), s=n(r.settled);
    rgRows.push({it:it,r:r,a:{settleRate:d>0?s/d*100:null, settled:s}});
  });
  rgRows.sort(bySettleRate);
  rgRows.forEach(function(x){
    var it=x.it, r=x.r;
    var d=n(r.done), s=n(r.settled);
    var p=d>0?Math.round(s/d*100):null;
    st+='<div class="rg-card"><div class="rg-t"><span class="n">'+it.name+'</span>'+
        '<span class="p pct '+cls(p)+'">'+(p===null?'—':p+'%')+'</span></div>'+
        '<div class="rg-l"><span>规划 '+fmt(r.alloc)+' 场</span><span>已开展 '+fmt(d)+' 场</span></div>'+
        '<div class="rg-l"><span>已核销 '+fmt(s)+' 场</span><span>取消 '+fmt(r.cancel)+' 场</span></div>'+
        (r.note?'<div class="m-note" style="margin-top:9px;font-size:11px;padding:7px 10px">'+r.note+'</div>':'')+
        '</div>';
  });
  st+='</div>';

  if(!isAll){
    st+='<div class="m-note">取消场次为各战役独立口径，跨战役汇总不宜直接相加，建议以单战役数值为准。核销率 = 已核销 ÷ 已开展。</div>';
  }

  openModal(st, region, '覆盖 '+items.length+' 个战役 ｜ 统计口径：项目开始 - 统计日');
}

// 战役明细（区域分布）
function showItem(itemId){
  var it=null;
  for(var i=0;i<ITEMS.length;i++) if(ITEMS[i].id===itemId) it=ITEMS[i];
  if(!it) return;
  var a=aggItem(it);

  var st='<div class="m-stats">'+
    ms('规划场次', fmt(a.alloc), '') +
    ms('已开展', fmt(a.done), '') +
    ms('已核销', fmt(a.settled), 'acc') +
    ms('核销率', a.settleRate===null?'—':Math.round(a.settleRate)+'%', 'gr') +
    ms('执行率', a.execRate===null?'—':Math.round(a.execRate)+'%', '') +
    ms('规划进度', a.planRate===null?'—':Math.round(a.planRate)+'%', '') +
    '</div>';

  st+='<div class="m-stats2">'+
    ms2('确定场次（含已开）', fmt(a.confirmed)) +
    ms2('已确定未开场次', fmt(a.planOpen)) +
    ms2('确定后取消场次', fmt(a.cancel)) +
    ms2('NOL 覆盖', fmt(a.nol)+' 人') +
    ms2('YOL 覆盖', fmt(a.yol)+' 人') +
    ms2('ROL 覆盖', fmt(a.rol)+' 人') +
    '</div>';

  st+='<div style="font-size:13px;font-weight:600;color:#14538F;margin:16px 0 10px">各区域明细（按核销率从高到低）</div>';
  st+='<div class="rg-grid">';
  var rgRows2=[];
  REGIONS.forEach(function(r){
    var row=rowOf(it,r); if(!row) return;
    var d=n(row.done), s=n(row.settled);
    rgRows2.push({r:r,row:row,a:{settleRate:d>0?s/d*100:null, settled:s}});
  });
  rgRows2.sort(bySettleRate);
  rgRows2.forEach(function(x){
    var r=x.r, row=x.row;
    var d=n(row.done), s=n(row.settled);
    var p=d>0?Math.round(s/d*100):null;
    st+='<div class="rg-card"><div class="rg-t"><span class="n">'+r+'</span>'+
        '<span class="p pct '+cls(p)+'">'+(p===null?'—':p+'%')+'</span></div>'+
        '<div class="rg-l"><span>规划 '+fmt(row.alloc)+' 场</span><span>已开展 '+fmt(d)+' 场</span></div>'+
        '<div class="rg-l"><span>已核销 '+fmt(s)+' 场</span><span>取消 '+fmt(row.cancel)+' 场</span></div>'+
        (row.note?'<div class="m-note" style="margin-top:9px;font-size:11px;padding:7px 10px">'+row.note+'</div>':'')+
        '</div>';
  });
  st+='</div>';

  openModal(st, it.name, it.group+' · '+it.line+' ｜ 覆盖 '+it.rows.length+' 个区域');
}
function ms(l,v,c){ return '<div class="m-stat"><div class="l">'+l+'</div><div class="v '+c+'">'+v+'</div></div>'; }
function ms2(k,v){ return '<div class="m-s2"><span class="n">'+k+'</span><b>'+v+'</b></div>'; }

/* ---------- 交互绑定 ---------- */
el('segRegion').addEventListener('click', function(e){
  var b=e.target.closest('button[data-r]'); if(!b) return;
  S.region=b.getAttribute('data-r'); S.view='region';
  renderFilters(); renderKpis(); renderChart(); syncTabs();
});
el('segLine').addEventListener('click', function(e){
  var b=e.target.closest('button[data-l]'); if(!b) return;
  S.line=b.getAttribute('data-l');
  renderFilters(); renderKpis(); renderChart(); syncTabs();
});
el('selItem').addEventListener('change', function(e){
  S.item=e.target.value;
  renderKpis(); renderChart(); syncTabs();
});
el('btnClear').addEventListener('click', function(){
  S.region='全部'; S.line='全部'; S.item='__ALL__'; S.view='region';
  renderFilters(); renderKpis(); renderChart(); syncTabs();
});
el('tabs').addEventListener('click', function(e){
  var b=e.target.closest('button[data-v]'); if(!b) return;
  S.view=b.getAttribute('data-v');
  renderChart(); syncTabs();
});
function syncTabs(){
  [].forEach.call(el('tabs').querySelectorAll('button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-v')===S.view);
  });
}

el('chart').addEventListener('click', function(e){
  var bi=e.target.closest('.bar-item');
  if(bi && S.view!=='table'){
    var key=bi.getAttribute('data-k');
    if(S.view==='region' && S.region==='全部'){ showRegion(key); return; }
    if(S.view==='region' && S.region!=='全部'){
      // 单区域下按战役名找
      pickedItems().forEach(function(it){ if(it.name===key) showItem(it.id); });
      return;
    }
    if(S.view==='item'){
      pickedItems().forEach(function(it){ if(it.name===key) showItem(it.id); });
      return;
    }
  }
  // 表格内点击行
  var tr=e.target.closest('tbody tr');
  if(tr && S.view==='table'){
    var nm=tr.querySelector('td') && tr.querySelector('td').textContent;
    if(nm && nm!=='合计') pickedItems().forEach(function(it){ if(it.name===nm) showItem(it.id); });
  }
});
el('mX').addEventListener('click', closeModal);
el('mask').addEventListener('click', function(e){ if(e.target===el('mask')) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

/* ---------- 启动 ---------- */
renderFilters(); renderKpis(); renderChart(); syncTabs();
})();
</script>
</body>
</html>
